# hi-vibe guards: push/PR마다 기계 게이트 실행 (d-2, d-3)
# 설치 시 프로젝트 언어에 맞는 job만 남길 것.
name: vibe-guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy import-linter
      - name: ruff (복잡도·미사용 코드)
        run: ruff check .
      - name: mypy (타입)
        run: mypy .
      - name: import-linter (레이어·순환)
        run: lint-imports

  js-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 설치 명령은 **이 저장소의 다른 워크플로와 같은 것**을 써라.
      # npm ci 는 lock 이 정확할 때만 통과하는데, 플랫폼별 optional 의존성
      # (예: wasm 패키지가 끌어오는 @emnapi/*)은 맥에서 만든 lock 에 안 들어가
      # 리눅스 러너에서 "lock 불일치"로 거부된다. 이 경우 배포 워크플로는
      # 이미 npm install 을 쓰고 있는데 여기만 npm ci 여서 몇 날 며칠 CI 가
      # 죽어 있던 실사례가 있다 — 관문이 죽으면 lint 가 아예 안 돈다.
      # 섞지 말고 하나로 맞출 것.
      - run: npm ci
      - name: eslint (복잡도·중첩·갓펑션)
        run: npx eslint .
      - name: 순환 의존
        run: npm run check:cycles
